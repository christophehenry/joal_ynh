location /__UNSLASHED_PATH__/websocket/ {
  proxy_pass                         http://127.0.0.1:__PORT__/__UNSLASHED_PATH__;  # Do NOT put a traling slash here
  proxy_http_version                 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";
}

location /__UNSLASHED_PATH__/ {
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_set_header Host              $host;
  proxy_pass                         http://127.0.0.1:__PORT__/__UNSLASHED_PATH__/ui/;
  proxy_redirect                     http:// https://;
}
